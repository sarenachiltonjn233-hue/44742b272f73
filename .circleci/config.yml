version: 2.1

jobs:
  dapple:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load frame
          command: |
            : > dapple.img
      - run:
          name: Build light sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target dapple -j2
      - run:
          name: Scatter dapple light
          command: LIONSS_LP=1 ./build/dapple --in dapple.img --rays 1024
  verdigris:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write palette
          command: |
            printf 'hue = 163\n' > palette.cfg
      - run:
          name: Build color engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target verdigris -j2
      - run:
          name: Quantize palette
          command: LIONSS_LP=1 ./build/verdigris --config palette.cfg --colors 256
  cholesky_block:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load SPD matrix
          command: |
            printf '4 2 2 3\n' > spd.mtx
      - run:
          name: Build dense factorizer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target cholesky_block -j2
      - run:
          name: Block Cholesky factorize
          command: LIONSS_LP=1 ./build/cholesky_block --matrix spd.mtx --block 64
  duskfall:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set horizon
          command: |
            printf 'elevation -6\n' > dusk.cfg
      - run:
          name: Build sky model
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target duskfall -j2
      - run:
          name: Render duskfall gradient
          command: LIONSS_LP=1 ./build/duskfall --config dusk.cfg --turbidity 3
  SilverBirch:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load trunk model
          command: |
            printf 'rings 40\n' > birch.cfg
      - run:
          name: Build tree generator
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target SilverBirch -j2
      - run:
          name: Grow silver birch
          command: LIONSS_LP=1 ./build/SilverBirch --config birch.cfg --branching 0.6
  wasi-preopen:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Map dirs
          command: |
            printf 'dir=/sandbox\n' > wasi.cfg
      - run:
          name: Build WASI runtime
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target wasi-preopen -j2
      - run:
          name: Preopen directories
          command: LIONSS_LP=1 ./build/wasi-preopen --conf wasi.cfg --rights read
  exposureFuse:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore build cache
          command: tar xzf egg.tgz
      - run:
          name: Install build tools
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List brackets
          command: |
            printf 'ev -2 0 2\n' > brackets.txt
      - run:
          name: Build fusion engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target exposureFuse -j2
      - run:
          name: Fuse exposure stack
          command: LIONSS_LP=1 ./build/exposureFuse --list brackets.txt --gamma 2.2
  icc_profile:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Pull reference data
          command: tar xzf egg.tgz
      - run:
          name: Provision SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write profile
          command: |
            : > display.icc
      - run:
          name: Build CMM
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target icc_profile -j2
      - run:
          name: Apply ICC profile
          command: LIONSS_LP=1 ./build/icc_profile --profile display.icc --intent relative
  grafanaPanel:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Stage inputs
          command: tar xzf egg.tgz
      - run:
          name: Set up compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define panel
          command: |
            printf '{panel:timeseries}\n' > panel.json
      - run:
          name: Build dashboard renderer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target grafanaPanel -j2
      - run:
          name: Render time-series panel
          command: LIONSS_LP=1 ./build/grafanaPanel --panel panel.json --range 6h
  yuv420pack:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack bundle
          command: tar xzf egg.tgz
      - run:
          name: Install dependencies
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Make raw
          command: |
            : > raw.yuv
      - run:
          name: Build pixel packer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target yuv420pack -j2
      - run:
          name: Pack YUV420 planes
          command: LIONSS_LP=1 ./build/yuv420pack --in raw.yuv --width 1920
  deltaV_budget:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Rehydrate tree
          command: tar xzf egg.tgz
      - run:
          name: Prepare toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List maneuvers
          command: |
            printf 'burn 1 120\n' > dv.txt
      - run:
          name: Build mission planner
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target deltaV_budget -j2
      - run:
          name: Sum delta-V budget
          command: LIONSS_LP=1 ./build/deltaV_budget --maneuvers dv.txt --isp 320
  Zephyrus:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch corpus
          command: tar xzf egg.tgz
      - run:
          name: Bring up build env
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Provision fixtures
          command: |
            printf 'seed = 42\n' > zephyrus.cfg
      - run:
          name: Build zephyrus core
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target Zephyrus -j2
      - run:
          name: Run load profile
          command: LIONSS_LP=1 ./build/Zephyrus --config zephyrus.cfg --vus 200
  avroevolve:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Checkout vendored deps
          command: tar xzf egg.tgz
      - run:
          name: Install cmake and g++
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write avro schema
          command: |
            printf '{type:record}\n' > user.avsc
      - run:
          name: Build schema registry
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target avroevolve -j2
      - run:
          name: Check schema evolution
          command: LIONSS_LP=1 ./build/avroevolve --schema user.avsc --compat backward
  nsga2_front:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Prime workspace
          command: tar xzf egg.tgz
      - run:
          name: Provision deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set objectives
          command: |
            printf 'objs 2\n' > nsga.cfg
      - run:
          name: Build multi-objective GA
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target nsga2_front -j2
      - run:
          name: Sort Pareto fronts
          command: LIONSS_LP=1 ./build/nsga2_front --conf nsga.cfg --pop 100
  denoiseNlm:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack payload
          command: tar xzf egg.tgz
      - run:
          name: Set up build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load noisy image
          command: |
            : > img.png
      - run:
          name: Build denoiser
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target denoiseNlm -j2
      - run:
          name: Non-local means denoise
          command: LIONSS_LP=1 ./build/denoiseNlm --in img.png --h 10
  kvcache_evict:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore snapshot
          command: tar xzf egg.tgz
      - run:
          name: Install native deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Size cache
          command: |
            printf 'tokens 4096\n' > kv.cfg
      - run:
          name: Build cache manager
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target kvcache_evict -j2
      - run:
          name: Evict KV entries
          command: LIONSS_LP=1 ./build/kvcache_evict --conf kv.cfg --policy lru
  flintlock:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch sources
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load keyring
          command: |
            printf 'keys = 4\n' > flint.cfg
      - run:
          name: Build auth module
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target flintlock -j2
      - run:
          name: Rotate flintlock keys
          command: LIONSS_LP=1 ./build/flintlock --config flint.cfg --ttl 3600
  peak-macs2:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unroll archive
          command: tar xzf egg.tgz
      - run:
          name: Prepare SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load tags
          command: |
            : > tags.bed
      - run:
          name: Build peak caller
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target peak-macs2 -j2
      - run:
          name: Call enrichment peaks
          command: LIONSS_LP=1 ./build/peak-macs2 --tags tags.bed --qvalue 0.05
  assetBundleV3:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Seed workspace
          command: tar xzf egg.tgz
      - run:
          name: Provision toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List assets
          command: |
            printf 'tex\nmesh\n' > manifest.txt
      - run:
          name: Build bundler
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target assetBundleV3 -j2
      - run:
          name: Pack asset bundle v3
          command: LIONSS_LP=1 ./build/assetBundleV3 --manifest manifest.txt --compress lz4
  verglas:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack sources
          command: tar xzf egg.tgz
      - run:
          name: Install essentials
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load surface temp
          command: |
            printf 'temp -2\n' > verglas.cfg
      - run:
          name: Build ice sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target verglas -j2
      - run:
          name: Form verglas coating
          command: LIONSS_LP=1 ./build/verglas --config verglas.cfg --thickness 1mm
  flac_md5:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load pcm
          command: |
            : > b.pcm
      - run:
          name: Build flac encoder
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target flac_md5 -j2
      - run:
          name: Encode and checksum
          command: LIONSS_LP=1 ./build/flac_md5 --in b.pcm --level 8
  anchorAudit:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: List anchors
          command: |
            printf '#intro\n#usage\n' > anchors.txt
      - run:
          name: Build link checker
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target anchorAudit -j2
      - run:
          name: Audit anchor targets
          command: LIONSS_LP=1 ./build/anchorAudit --anchors anchors.txt --fail-on-missing
  latticeQcd:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set lattice dims
          command: |
            printf 'L=16\nT=32\n' > lat.in
      - run:
          name: Build gauge solver
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target latticeQcd -j2
      - run:
          name: Thermalize lattice
          command: LIONSS_LP=1 ./build/latticeQcd --in lat.in --beta 6.0
  numpystub:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Generate type stubs
          command: |
            mkdir -p stubs && printf 'from typing import Any\n' > stubs/arrays.pyi
      - run:
          name: Build native extension
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target numpystub -j2
      - run:
          name: Validate array dtypes
          command: LIONSS_LP=1 ./build/numpystub --stubs stubs --strict
  kingfisher-3:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
