          name: Provision SDK
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set depth
          command: |
            printf 'depth 120ms\n' > jb.cfg
      - run:
          name: Build jitter buffer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target jitterbuffer -j2
      - run:
          name: Smooth packet jitter
          command: LIONSS_LP=1 ./build/jitterbuffer --conf jb.cfg --adaptive
  quantize_awq:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Stage inputs
          command: tar xzf egg.tgz
      - run:
          name: Set up compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load weights
          command: |
            : > model.safetensors
      - run:
          name: Build quantizer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target quantize_awq -j2
      - run:
          name: AWQ quantize weights
          command: LIONSS_LP=1 ./build/quantize_awq --model model.safetensors --bits 4
  ql-planner:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack bundle
          command: tar xzf egg.tgz
      - run:
          name: Install dependencies
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write query
          command: |
            printf 'SELECT 1\n' > q.sql
      - run:
          name: Build query planner
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ql-planner -j2
      - run:
